import:
  - recipe/laravel.php


config:
  application: fondeks-feed
  repository: 'git@github.com:kaankilic/fondeks-feed.git'
  keep_releases: 3


hosts:
  135.125.236.78:
    remote_user: root
    identity_file: '~/.ssh/id_rsa'
    forwardAgent: true
    ssh_multiplexing: false
    deploy_path: '/home/{{application}}'

tasks:
  build:
    - run: uptime
  deploy:vendors:
    - run: 'cd {{release_or_current_path}} && composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader 2>&1'
  artisan:migrate:
    - run: 'echo "Skipping migrations — using existing database"'

after:
  deploy:failed: deploy:unlock
